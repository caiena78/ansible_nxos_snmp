---  
netbox_url: "https://netbox.example.com"
netbox_token: "your_token_here"
netbox_validate_certs: false
snmp_nexus_rw_group: "network-admin"
snmp_nexus_ro_group: "network-operator"
snmp_rw_user: "RWuser"
snmp_ro_user: "ROuser"
snmp_auth_passphrase_rw: "Password"
snmp_priv_passphrase_rw: "Password"
snmp_auth_passphrase_ro: "Password"
snmp_priv_passphrase_ro: "Password"
snmp_acl_name: "MANAGEMENT_ACL"

CAT_SNMP_VIEW_NAME: cat_view
CAT_SNMP_VIEW_OID: sample

CAT_SNMP_GROUP: cat_group

CAT_SNMP_USER: <user>
CAT_SNMP_AUTH_PROTO: <sha>
CAT_SNMP_AUTH_KEY: <authkey>

CAT_SNMP_PRIV_PROTO: aes
CAT_SNMP_PRIV_BITS: 128
CAT_SNMP_PRIV_KEY: <prive_key>

nxos_snmp_protected_users: []
  
nxos_snmp_oid_test: "1.3.6.1.2.1.1.1.0"


nxos_snmp_cleanup: false

nxos_snmp:
  # ------------------------------------------------------------
  # ACL (built via NetBox elsewhere, referenced here by name)
  # ------------------------------------------------------------
  acl:
    name: MANAGEMENT
    tag: snmp_acl_allow

  # ------------------------------------------------------------
  # Views
  # ------------------------------------------------------------
  views:
    ro: ROview
    rw: RWview

  # ------------------------------------------------------------
  # Groups
  # ------------------------------------------------------------
  groups:
    ro: network-operator
    rw: network-admin

  group_context:
    enabled: true
    prefix: "vlan-"

  # ------------------------------------------------------------
  # Standard SNMPv3 users (RO / RW)
  # ------------------------------------------------------------
  users:
    - username: ROuser
      access: ro
      auth_proto: sha
      auth_pass: "password"
      priv_proto: aes
      priv_bits: 128
      priv_pass: "password"

    - username: RWuser
      access: rw
      auth_proto: sha
      auth_pass: "password"
      priv_proto: aes
      priv_bits: 128
      priv_pass: "password"

    - username: user1
      access: rw
      auth_proto: sha
      auth_pass: "password"
      priv_proto: aes
      priv_bits: 128
      priv_pass: "password"       
      host: 1.2.3.4
