---

- name: Include netbox_getsite
  include_role:
    name: netbox_getsite
    # expects: netbox_site_response

# ------------------------------------------------------------
# Set SNMP location from NetBox (custom field SNMP_LOCATION)
# ------------------------------------------------------------
- name: Set SNMP location (fact) from NetBox
  set_fact:
    SNMP_LOCATION: "{{ netbox_site_response.json.custom_fields.SNMP_LOCATION }}"
  when:
    - netbox_site_response.json is defined
    - netbox_site_response.json | length > 0
    - netbox_site_response.json.custom_fields is defined
    - netbox_site_response.json.custom_fields.SNMP_LOCATION is defined
    - netbox_site_response.json.custom_fields.SNMP_LOCATION | length > 0

# ------------------------------------------------------------
# MANAGEMENT ACL: build/update via mgnt_acl role (NetBox-sourced)
# ------------------------------------------------------------
- name: Create/update management ACL
  ansible.builtin.include_role:
    name: mgnt_acl
  vars:
    mgnt_acl: "{{ nxos_snmp.acl }}"

# ------------------------------------------------------------
# Global SNMP settings
# ------------------------------------------------------------
- name: Set SNMP location (device config)
  nxos_config:
    lines:
      - "snmp-server location {{ SNMP_LOCATION }}"
    before:
      - "no snmp-server location"
    match: strict
    replace: block
  when: SNMP_LOCATION is defined
  ignore_errors: true

- name: Set SNMP globalEnforcePriv
  nxos_config:
    lines:
      - "snmp-server globalEnforcePriv"
  ignore_errors: true



# ------------------------------------------------------------
# Users (looped from nxos_snmp.users)
# - access selects the group: ro/rw -> nxos_snmp.groups.ro/rw
# - AES uses bits: aes-128, aes-256, etc.
# ------------------------------------------------------------
- name: Configure SNMPv3 users from nxos_snmp.users
  nxos_config:
    lines:
      - >-
        snmp-server user {{ item.username }}
        {{ nxos_snmp.groups[item.access] }}
        auth {{ item.auth_proto | lower }} {{ item.auth_pass }}
        priv {{
          (item.priv_proto | lower ~ '-' ~ (item.priv_bits | default(128) | string))
          if (item.priv_proto | lower) == 'aes'
          else (item.priv_proto | lower)
        }} {{ item.priv_pass }}
  loop: "{{ nxos_snmp.users }}"
  ignore_errors: true

- name: DEBUG | Rendered SNMP user commands
  debug:
    msg:
      - >-
        snmp-server user {{ item.username }}
        {{ nxos_snmp.groups[item.access] }}
        auth {{ item.auth_proto | lower }} {{ item.auth_pass }}
        priv {{
          (item.priv_proto | lower ~ '-' ~ (item.priv_bits | default(128) | string))
          if (item.priv_proto | lower) == 'aes'
          else (item.priv_proto | lower)
        }} {{ item.priv_pass }}
  loop: "{{ nxos_snmp.users }}"

- name: Apply IPv4 ACL to each SNMP user
  nxos_config:
    lines:
      - "snmp-server user {{ item.username }} use-ipv4acl {{ nxos_snmp.acl.name }}"
    match: strict
    replace: block
  loop: "{{ nxos_snmp.users }}"
  ignore_errors: true

# ------------------------------------------------------------
# Optional per-user SNMP host target (if item.host is defined)
# NOTE: This is for traps/informs destinations, not polling permission.
# ------------------------------------------------------------
- name: Configure SNMP host targets (optional per-user)
  nxos_config:
    lines:
      - "snmp-server host {{ item.host }} version 3 priv {{ item.username }}"
    match: line
  loop: "{{ nxos_snmp.users }}"
  when:
    - item.host is defined
    - item.host | length > 0
  ignore_errors: true

# ------------------------------------------------------------
# Keep your original "admin" ACL binding (optional)
# ------------------------------------------------------------
- name: Set SNMP user admin ACL
  nxos_config:
    lines:
      - "snmp-server user admin use-ipv4acl {{ nxos_snmp.acl.name }}"
    match: strict
    replace: block
  ignore_errors: true

# ------------------------------------------------------------
# Add users with ACL
# ------------------------------------------------------------

- name: Apply IPv4 ACL to each SNMP user (NX-OS)
  cisco.nxos.nxos_config:
    lines:
      - "snmp-server user {{ item.username }} use-ipv4acl {{ nxos_snmp.acl.name }}"
    match: line
  loop: "{{ nxos_snmp.users }}"

# ------------------------------------------------------------------------
# CISCO ISE: sync SNMPv3 polling credentials for this device
# Users flagged with `cisco_ise: true` in nxos_snmp.users are the
# credentials Cisco ISE should use to poll this device via SNMPv3.
# ------------------------------------------------------------------------
- name: Determine SNMPv3 user(s) designated for Cisco ISE
  set_fact:
    ise_snmp_users: "{{ nxos_snmp.users | selectattr('cisco_ise', 'defined') | selectattr('cisco_ise') | list }}"

- name: Sync SNMPv3 credentials to Cisco ISE
  when: ise_snmp_users | length > 0
  block:
    - name: Set desired ISE SNMP user (first flagged user)
      set_fact:
        ise_snmp_user: "{{ ise_snmp_users | first }}"

    - name: Map SNMPv3 protocols to Cisco ISE values
      set_fact:
        ise_snmp_auth_protocol: "{{ ise_snmp_user.auth_proto | upper }}"
        ise_snmp_priv_protocol: >-
          {{
            ('AES' ~ (ise_snmp_user.priv_bits | default(128) | string))
            if (ise_snmp_user.priv_proto | lower) == 'aes'
            else (ise_snmp_user.priv_proto | upper)
          }}

    - name: Check if device exists in Cisco ISE by IP
      ansible.builtin.uri:
        url: "https://{{ ise_hostname }}:{{ ise_port }}/ers/config/networkdevice?filter=ipaddress.EQ.{{ ansible_host }}"
        method: GET
        url_username: "{{ ise_username }}"
        url_password: "{{ ise_password }}"
        force_basic_auth: yes
        validate_certs: "{{ ise_verify }}"
        headers:
          Accept: "application/json"
        status_code: 200
      register: ise_snmp_ip_check
      delegate_to: localhost

    - name: Set ISE device-found flag
      set_fact:
        ise_snmp_device_found: "{{ ise_snmp_ip_check.json.SearchResult.total | int > 0 }}"

    - name: Get full device record from Cisco ISE
      ansible.builtin.uri:
        url: "https://{{ ise_hostname }}:{{ ise_port }}/ers/config/networkdevice/{{ ise_snmp_ip_check.json.SearchResult.resources[0].id }}"
        method: GET
        url_username: "{{ ise_username }}"
        url_password: "{{ ise_password }}"
        force_basic_auth: yes
        validate_certs: "{{ ise_verify }}"
        headers:
          Accept: "application/json"
        status_code: 200
      register: ise_snmp_device_details
      delegate_to: localhost
      when: ise_snmp_device_found

    - name: Build updated SNMP settings for Cisco ISE
      set_fact:
        ise_snmp_settings: >-
          {{
            (ise_snmp_device_details.json.NetworkDevice.snmpsettings | default({}))
            | combine({
                'version': 'THREE',
                'v3Query': {
                  'userName': ise_snmp_user.username,
                  'securityLevel': 'AuthPriv',
                  'authProtocol': ise_snmp_auth_protocol,
                  'authPassword': ise_snmp_user.auth_pass,
                  'privacyProtocol': ise_snmp_priv_protocol,
                  'privacyPassword': ise_snmp_user.priv_pass
                }
              }, recursive=True)
          }}
      when: ise_snmp_device_found

    - name: Push updated SNMP settings to Cisco ISE
      ansible.builtin.uri:
        url: "https://{{ ise_hostname }}:{{ ise_port }}/ers/config/networkdevice/{{ ise_snmp_device_details.json.NetworkDevice.id }}"
        method: PUT
        url_username: "{{ ise_username }}"
        url_password: "{{ ise_password }}"
        force_basic_auth: yes
        validate_certs: "{{ ise_verify }}"
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          NetworkDevice: "{{ ise_snmp_device_details.json.NetworkDevice | combine({'snmpsettings': ise_snmp_settings}) }}"
        status_code: [200, 201]
      delegate_to: localhost
      when: ise_snmp_device_found

    - name: Warn if device was not found in Cisco ISE by IP
      debug:
        msg: "{{ ansible_host }} not found in Cisco ISE (by IP) - skipped SNMP settings sync for user {{ ise_snmp_user.username }}"
      when: not ise_snmp_device_found





# ------------------------------------------------------------------------
# NX-OS CLEANUP: remove SNMPv3 users NOT in nxos_snmp.users
# Controlled by: nxos_snmp_cleanup: true
# ------------------------------------------------------------------------

- name: Cleanup | Gather SNMP users (NX-OS table)
  cisco.nxos.nxos_command:
    commands:
      - "show snmp user"
  register: snmp_users_show
  when: nxos_snmp_cleanup | default(false) | bool


- name: Cleanup | Trim first 5 lines from show snmp user output
  set_fact:
    snmp_users_show: >-
      {{
        snmp_users_show
        | combine({
            'stdout_lines': [
              (snmp_users_show.stdout_lines[0] | default([]))[6:]
            ]
          }, recursive=True)
      }}
  when: nxos_snmp_cleanup | default(false) | bool


- name: Cleanup | Trim last 5 lines from show snmp user output
  set_fact:
    snmp_users_show: >-
      {{
        snmp_users_show
        | combine({
            'stdout_lines': [
              (snmp_users_show.stdout_lines[0] | default([]))[:-6]
            ]
          }, recursive=True)
      }}
  when: nxos_snmp_cleanup | default(false) | bool




- name: Cleanup | DEBUG trimmed stdout_lines list
  debug:
    var: snmp_users_show.stdout_lines[0]
  when: nxos_snmp_cleanup | default(false) | bool




- name: Cleanup | Build desired SNMP username list
  set_fact:
    desired_snmp_usernames: "{{ nxos_snmp.users | map(attribute='username') | list }}"
  when: nxos_snmp_cleanup | default(false) | bool

- name: Cleanup | Build existing SNMP username list (parse first column)
  set_fact:
    existing_snmp_usernames: >-
      {{
        (snmp_users_show.stdout_lines[0] | default([]))
        | map('trim')
        | reject('match', '^$')
        | reject('search', '^_+')
        | reject('search', '^SNMP USERS')
        | reject('search', '^NOTIFICATION TARGET USERS')
        | reject('search', '^User\\s+Auth\\s+Priv')
        | reject('search', '^____')
        | select('match', '^[A-Za-z0-9]')
        | map('split')
        | map('first')
        | list
        | unique
      }}
  when: nxos_snmp_cleanup | default(false) | bool



# - name: Cleanup | Build existing SNMP username list (parse user rows only)
#   set_fact:
#     existing_snmp_usernames: >-
#       {{
#         (snmp_users_show.stdout_lines[0] | default([]))
#         | map('trim')
#         | reject('match', '^$')
#         | reject('match', '^_+$')
#         | select('match', '^[A-Za-z0-9][A-Za-z0-9._-]*\\s+(md5|sha|noauth)\\b')
#         | map('split')
#         | map('first')
#         | list
#         | unique
#       }}
#   when: nxos_snmp_cleanup | default(false) | bool


- name: Cleanup | Set protected users list
  set_fact:
    protected_users: "{{ nxos_snmp_protected_users | default(['admin']) }}"
  when: nxos_snmp_cleanup | default(false) | bool

- name: Cleanup | Compute SNMP users to remove
  set_fact:
    snmp_users_to_remove: >-
      {{
        (existing_snmp_usernames | difference(desired_snmp_usernames))
        | difference(protected_users)
      }}
  when: nxos_snmp_cleanup | default(false) | bool


# --- HOST CLEANUP (NX-OS) - reliable ---
- name: Cleanup | Gather SNMP section from running-config (NX-OS)
  cisco.nxos.nxos_command:
    commands:
      - "show running-config snmp"
  register: snmp_run_snmp
  when: nxos_snmp_cleanup | default(false) | bool

- name: Cleanup | Extract SNMP host lines from SNMP section
  set_fact:
    existing_snmp_host_lines: >-
      {{
        (snmp_run_snmp.stdout_lines[0] | default([]))
        | map('trim')
        | select('match', '^snmp-server host ')
        | list
      }}
  when: nxos_snmp_cleanup | default(false) | bool

- name: Cleanup | DEBUG existing SNMP host lines
  debug:
    var: existing_snmp_host_lines
  when: nxos_snmp_cleanup | default(false) | bool

- name: Cleanup | Remove SNMP host statements that reference removed users
  cisco.nxos.nxos_config:
    lines: >-
      {{
        existing_snmp_host_lines
        | select('search', '\\b(' ~ (snmp_users_to_remove | map('regex_escape') | join('|')) ~ ')\\b')
        | map('regex_replace', '^(.*)$', 'no \\1')
        | list
      }}
    match: none
  when:
    - nxos_snmp_cleanup | default(false) | bool
    - snmp_users_to_remove is defined
    - snmp_users_to_remove | length > 0

- name: Cleanup | DEBUG lists (sanity check)
  debug:
    msg:
      - "Desired: {{ desired_snmp_usernames }}"
      - "Existing: {{ existing_snmp_usernames }}"
      - "Protected: {{ protected_users }}"
      - "To remove: {{ snmp_users_to_remove }}"
  when: nxos_snmp_cleanup | default(false) | bool

# IMPORTANT: remove by USERNAME ONLY (do NOT try to remove full config lines)
# This is the safest form on NX-OS and avoids 'remove last group' issues. [1](https://community.spiceworks.com/t/cisco-layer-3-switch-purge-snmp-configuration/658909)
- name: Cleanup | Remove unused SNMPv3 users (username only)
  cisco.nxos.nxos_config:
    lines: "{{ snmp_users_to_remove | map('regex_replace', '^(.*)$', 'no snmp-server user \\1') | list }}"
    match: none
  when:
    - nxos_snmp_cleanup | default(false) | bool
    - snmp_users_to_remove is defined
    - snmp_users_to_remove | length > 0
  register: snmp_user_remove_result
  ignore_errors: true

- name: Cleanup | Verify SNMP users after removal
  cisco.nxos.nxos_command:
    commands:
      - "show snmp user"
  register: snmp_users_show_after
  when:
    - nxos_snmp_cleanup | default(false) | bool

- name: Cleanup | DEBUG post-check
  debug:
    var: snmp_users_show_after.stdout_lines[0]
  when: nxos_snmp_cleanup | default(false) | bool
 
